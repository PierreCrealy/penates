<VirtualHost *:80>
    ServerName penates.archer.local

    DocumentRoot /var/www/html/public

    # Environment variables
    # Some PHP apps need to access the Authorization header through HTTP_AUTHORIZATION.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    # Some apps need this to properly detect HTTPS with reverse proxies like Traefik.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/penates-archer.error.log
    CustomLog ${APACHE_LOG_DIR}/penates-archer.access.log combined

    # Directory-specific configuration
    <Directory /var/www/html/public>
        DirectoryIndex /index.php
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

</VirtualHost>
